version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: nfc-lock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nfc_lock_root_2024
      MYSQL_DATABASE: nfc_lock
      MYSQL_USER: nfc_user
      MYSQL_PASSWORD: nfc_pass_2024
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - /home/nfc_lock/mysql/data:/var/lib/mysql
      - /home/nfc_lock/mysql/conf:/etc/mysql/conf.d
      - /home/nfc_lock/mysql/logs:/var/log/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - nfc-lock-network

  # Redis缓存服务
  redis:
    image: redis:7.2-alpine
    container_name: nfc-lock-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - /home/nfc_lock/redis/data:/data
      - /home/nfc_lock/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      TZ: Asia/Shanghai
    networks:
      - nfc-lock-network

  # NFC Lock应用服务
  nfc-lock-app:
    image: openjdk:17-jdk-slim
    container_name: nfc-lock-app
    restart: unless-stopped
    ports:
      - "18086:8086"
    volumes:
      - /home/nfc_lock/app/jar:/app/jar
      - /home/nfc_lock/app/config:/app/config
      - /home/nfc_lock/app/logs:/app/logs
      - /home/nfc_lock/app/upload:/app/upload
    working_dir: /app
    command: >
      sh -c " 
      apt-get update && 
      apt-get install -y fontconfig fonts-dejavu-core && 
      java -Xms512m -Xmx1024m 
      -Dspring.profiles.active=docker 
      -Dspring.config.location=classpath:file:/app/config/ 
      -Djava.awt.headless=true 
      -Dfile.encoding=UTF-8 
      -Duser.timezone=Asia/Shanghai 
      -Dsun.java2d.fontpath=/usr/share/fonts/ 
      -jar /app/jar/nfc-lock-server.jar 
      "
    environment:
      TZ: Asia/Shanghai
    networks:
      - nfc-lock-network

  # Nginx反向代理服务
  nginx:
    image: nginx:1.25-alpine
    container_name: nfc-lock-nginx
    restart: unless-stopped
    ports:
      - "1180:80"
      - "11443:443"
    volumes:
      - /home/nfc_lock/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - /home/nfc_lock/nginx/conf/conf.d:/etc/nginx/conf.d
      - /home/nfc_lock/nginx/logs:/var/log/nginx
      - /home/nfc_lock/nginx/ssl:/etc/nginx/ssl
      - /home/nfc_lock/app/upload:/var/www/upload  # 静态文件服务
      - /home/nfc_lock/nginx/html:/usr/share/nginx/html
    environment:
      TZ: Asia/Shanghai
    networks:
      - nfc-lock-network

# 网络定义
networks:
  nfc-lock-network:
    driver: bridge